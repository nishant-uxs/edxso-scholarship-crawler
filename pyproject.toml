[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarship-intel"
version = "1.0.0"
description = "Scholarship Intelligence Crawler — Discover → Crawl → Extract → Verify → Score → Store → Update"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scholarship-intel = "scholarship_intel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarship_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
