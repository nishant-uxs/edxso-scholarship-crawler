# Seed sources for discovery. The crawler follows links from these pages
# and classifies new domains — not a hard-coded one-URL-one-scraper list.
# Local PDFs are cached copies of official documents (same bytes as source URL).

seeds:
  - name: National Scholarship Portal — All Schemes
    url: https://scholarships.gov.in/All-Scholarships
    source_type: government_portal
    discovery_role: listing

  - name: UGC — National Scholarship for PG Studies
